<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS: Fuentes</title>
    <link
      href="https://fonts.googleapis.com/css?family=Poppins:100,100italic,200,200italic,300,300italic,regular,italic,500,500italic,600,600italic,700,700italic,800,800italic,900,900italic"
      rel="stylesheet"
    />
    <style>
      @font-face {
        font-family: "Mi Poppins";
        src: url(fuentes/poppins-v24-latin-regular.woff2) format("woff2");
        font-weight: 900;
        font-display: sawp; /* Muestra el text mientras carga la fuenta */
      }
      body {
        font-family: "Times New Roman";
        font-family: "Mi Poppins";
      }
    </style>
  </head>
  <body>
    <p>Este text usa la fuente Poppins</p>
  </body>
</html>
